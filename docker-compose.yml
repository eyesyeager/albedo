# ==========================================================================
# Albedo 部署编排（Docker Compose）
#
# 架构：一个 compose 网络内
#   albedo-nginx（80/443）──反代 /api/ /site/──► albedo-backend（8080，仅本机可见）
#
# 外部依赖（不在本 compose 内，沿用生产远程基础设施）：
#   - MySQL 8.0（CynosDB，albedo 库）   - Redis
#   - 耶瞳 Thrift（eyes-auth.thrift.host）- 混元 API
#
# 🔴 构建顺序：后端依赖本机 mvn 产物，先打包再构建镜像：
#   cd backend && mvn -q -DskipTests package && cd ..
#   docker compose up -d --build
#
# 🔴 生产阻断项（违反则 StartupChecker 拒绝启动 / 鉴权失效）：
#   sys_config: tenant.dev_host_mapping_enabled = false
#   sys_config: tenant.trust_forwarded_host = true（本配置已透传 X-Forwarded-Host）
#   sys_config: mcp.require_https = true
# ==========================================================================

services:
  albedo-backend:
    build:
      context: ./backend
      # 默认使用本机 target/albedo-backend.jar（私有依赖 eyesAuth 无法在容器内解析）
      dockerfile: Dockerfile
    image: albedo-backend:1.0.0
    container_name: albedo-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod   # 激活 application-prod.yml
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"        # 仅本机可访问，由前端 nginx 容器反代
    volumes:
      - albedo-logs:/app/logs        # 业务日志持久化
    healthcheck:
      # temurin JRE 镜像无 curl/wget，用 bash /dev/tcp 探测 8080 端口
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  albedo-nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: albedo-frontend:1.0.0
    container_name: albedo-nginx
    restart: unless-stopped
    depends_on:
      albedo-backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 🔴 HTTPS 证书目录（挂载 fullchain.pem / privkey.pem，启用 nginx.conf 中的 443 模板）
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      # nginx:alpine 自带 busybox wget
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  albedo-logs:
