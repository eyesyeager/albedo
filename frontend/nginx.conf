# ==========================================================================
# Albedo 前端 Nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 🔴 租户识别依赖真实 Host：
#   - 透传 Host（proxy_set_header Host $host）
#   - 同时写 X-Forwarded-Host（需 sys_config: tenant.trust_forwarded_host = true，
#     README §5.2 末尾；后端 TenantFilter 经 X-Forwarded-Host 识别租户）
# 🔴 SSE 流（/api/ 下流式端点）必须关闭代理缓冲，否则首字节被 Nginx 吞掉：
#   proxy_buffering off + proxy_read_timeout 300s
# ==========================================================================

# ---- HTTP（默认；HTTPS 模板见文末注释，有证书后启用） ----
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 容器健康检查探针
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- 后端 API（含 SSE 流式端点） ----
    location /api/ {
        proxy_pass http://albedo-backend:8080;
        proxy_set_header Host $host;                    # 🔴 租户识别依赖原始 Host
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;                            # 🔴 SSE 必须关闭缓冲
        proxy_read_timeout 300s;                        # 需 ≥ sys_config generation_deadline
        proxy_connect_timeout 20s;
        proxy_send_timeout 300s;
    }

    # ---- 租户站点配置接口（站点徽标 / 主题 / 文案） ----
    location /site/ {
        proxy_pass http://albedo-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # ---- 静态资源加速 ----
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 上传类工具预留（M2 文件工具如需要可调大）
    client_max_body_size 20m;

    # 安全响应头（有 HTTPS 后建议补 HSTS）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

