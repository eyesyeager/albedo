<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      标题与 favicon 由租户已发布站点配置（GET /api/v1/site/config）在运行时设置，
      🔴 禁止在此硬编码任何租户品牌信息。

      下面这个 icon 只是**中性占位**：不声明任何 icon 时浏览器会自动探测默认路径
      /favicon.ico，而本项目不存在该资源 → 首屏必然 404（BUG-20260816-002）。
      因此内联一枚 16×16 中性灰 PNG（79 字节 data-uri，零额外请求、无任何租户品牌）。
      🔴 选 PNG 而非 SVG：部分浏览器（如 Safari）不支持 SVG favicon，
         解码失败会**继续回退**探测 /favicon.ico，404 又会回来。
      🔴 id 必须与 composables/useSiteBranding.ts 的 FAVICON_ID 一致：
         站点配置到达后 applyFavicon 按 id 命中此节点并**原位替换 href**，
         改 id 会新增第二个 icon 节点、导致租户 favicon 替换看似"不生效"。
         该耦合由 tests/unit/favicon.spec.ts 与 tests/e2e/console-hygiene.spec.ts 守护。
    -->
    <link
      id="albedo-favicon"
      rel="icon"
      type="image/png"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFklEQVR42mO4cuUGSYhhVMOohuGrAQA4fIAfyB7FGQAAAABJRU5ErkJggg=="
    />
    <title>Albedo</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
