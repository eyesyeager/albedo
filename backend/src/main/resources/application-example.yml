# ==========================================================================
# Albedo 后端配置模板（脱敏，提交 Git）
# 用法：复制为 application.yml 并填入真实凭据（真实文件已被 .gitignore 忽略）
#   cp src/main/resources/application-example.yml src/main/resources/application.yml
# 🔴 键集必须与 application.yml 完全一致；新增/删除键必须同步两份文件。
# 🔴 禁止使用 ${ENV_VAR} 环境变量占位、禁止 KMS/Vault（架构红线）。
# 配置白名单纪律见 docs/architecture.md §7.1。
# ==========================================================================
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    connection-timeout: 20s
    threads:
      max: 200
      min-spare: 20

spring:
  application:
    name: albedo-backend
  profiles:
    active: dev

  datasource:
    # ⚠️ characterEncoding 必须是 Java 字符集名（UTF-8）；写 utf8mb4 会被 Connector/J 拒绝。
    url: jdbc:mysql://<MYSQL_HOST>:<MYSQL_PORT>/albedo?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true
    username: <MYSQL_USERNAME>
    password: <MYSQL_PASSWORD>
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: albedo-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1740000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false
    show-sql: false

  data:
    redis:
      host: <REDIS_HOST>
      port: 6379
      password: <REDIS_PASSWORD>
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms

  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  mvc:
    async:
      # 🔴 仅传输层硬兜底（ADR-017 的 L1）；业务封顶见 sys_config `chat.generation_deadline_seconds`
      # 🔴 必须 ≥ chat.generation_deadline_seconds + chat.deadline_grace_seconds（默认 315s），
      #    否则 StartupChecker 拒绝启动
      request-timeout: 600000

  threads:
    virtual:
      enabled: false

eyes-auth:
  enabled: true
  app-id: albedo
  auth-type: 1
  thrift:
    host: <EYES_USER_THRIFT_HOST>
    port: 9011

app:
  ai:
    base-url: https://tokenhub.tencentmaas.com/v1
    api-key: <AI_API_KEY>
    default-model: deepseek-v4-flash
    connect-timeout-seconds: 10
    request-timeout-seconds: 300
  crypto:
    secret: <CRYPTO_SECRET_AT_LEAST_32_CHARS>
  async:
    core-pool-size: 16
    max-pool-size: 64
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: ai-stream-
    await-termination-seconds: 30
  cache:
    env: dev
  cors:
    allowed-origin-patterns:
      - http://localhost:5173
      - http://127.0.0.1:5173

logging:
  level:
    root: info
    com.eyes.albedo: debug
    org.hibernate.SQL: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}][%X{tenantId}][%X{uid}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
